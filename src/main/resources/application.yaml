spring:
  application:
    name: gestao-funcionarios

server:
  port: 8081
  servlet:
    context-path: /gestao-funcionarios/api
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
